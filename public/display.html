<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DJ BazooKI — Übersicht</title>
<link rel="stylesheet" href="/app.css" />
<script src="/qrcode-lib.js"></script>
<style>
  /* Grossbildschirm-Ansicht: eigenes Layout, nutzt aber die Farben/Fonts/Komponenten
     aus app.css (bar-*, eq, panel/row, empty, badge ...) unveraendert -
     hier nur Groessen & Anordnung fuer einen Laptop-/TV-Screen im Querformat. */
  /* ---- Neon Floor: nur diese Seite ----
     Ueberschreibt die Palette aus app.css. guest.html und dj.html bleiben hell.
     --accent wird zur Laufzeit auf die Farbe der laufenden Richtung gesetzt (siehe Script). */
  :root{
    --bg:#07060A; --bg2:#040308;
    --surface:#12121A;
    --surface2:#1A1A26;
    --border:#FFFFFF1F;
    --gold:#FFD24A;
    --goldSoft:#FFE28C;
    --rose:#FF6FA5;
    --ink:#EDEFF7;
    --ivory:#EDEFF7;
    --dim:#969CB2;
    --accent:#FFD24A;
    --accentGlow:#FFD24A38;
  }
  html{ color-scheme:dark; }
  body{ background:var(--bg2); position:relative; }

  /* Farbschleier in der Farbe der laufenden Richtung - dreht beim Richtungswechsel mit. */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(80% 60% at 10% -5%, var(--accentGlow) 0%, transparent 60%),
      radial-gradient(70% 60% at 95% 105%, var(--accentGlow) 0%, transparent 65%),
      radial-gradient(120% 90% at 50% 40%, var(--bg) 0%, var(--bg2) 75%);
    animation:breathe 14s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ opacity:.75; } 50%{ opacity:1; } }

  /* app.css hat hier helle Werte fest verdrahtet - fuer die dunkle Ansicht nachgezogen. */
  .bar-track{ background:#FFFFFF14; }
  .bar-fill{ box-shadow:0 0 14px -2px #FFFFFF40; }
  .empty{ background:#FFFFFF08; }
  .badge{ color:#0B0A10; }
  .eq i{ box-shadow:0 0 10px currentColor; }

  html, body{ height:100%; }
  body{ overflow-x:hidden; }
  .stage{ max-width:1560px; margin:0 auto; padding:22px 34px 30px; min-height:100vh; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:20px; }
  .topbar .crest{ text-align:left; margin:0; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .topbar .couple{ font-size:clamp(26px, 3vw, 38px); margin:0; }
  .topbar .date{ margin:0; }
  .topbar .toolname{ margin:0; }
  .clock{ font-family:var(--display); font-size:20px; color:var(--dim); letter-spacing:1px; white-space:nowrap; }

  .qrcard{ display:flex; align-items:center; gap:12px; background:#FFFFFF0A; border:1px solid var(--border); border-radius:16px; padding:9px 16px 9px 9px; box-shadow:0 0 30px -20px var(--accent); flex-shrink:0; }
  .qrcard .qrbox{ width:72px; height:72px; background:#fff; border-radius:8px; padding:4px; flex-shrink:0; }
  .qrcard .qrbox svg{ display:block; width:100%; height:100%; }
  .qrcard .txt{ font-family:var(--display); font-size:15px; line-height:1.3; color:var(--ink); }
  .qrcard .txt b{ color:var(--gold); display:block; font-size:16px; }

  .grid2{ display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:980px){ .grid2{ grid-template-columns:minmax(0,1fr); } .stage{ padding:18px 16px 24px; } .topbar{ flex-direction:column; align-items:flex-start; } }

  /* Laptop-Groessen: enger setzen, damit ohne Scrollen alles aufs Bild passt. */
  @media (max-width:1440px){
    .stage{ padding:16px 24px 22px; }
    .hero-now{ padding:22px; }
    .hero-art{ width:clamp(130px,15vw,190px); height:clamp(130px,15vw,190px); }
    .hero-now .flex{ gap:22px; }
    .panel{ padding:14px 15px 12px; margin-bottom:14px; }
    .dirband{ padding:11px 18px 12px; margin-bottom:14px; }
    .topbar{ margin-bottom:14px; }
  }
  @media (max-height:860px){
    .up-row{ padding:7px 2px; }
    .dirband{ margin-bottom:12px; }
  }

  /* ---- Now playing hero ---- */
  .hero-now{ background:#FFFFFF0A; border:1px solid var(--border); border-radius:24px; padding:26px;
    box-shadow:0 0 60px -34px var(--accent); }
  .hero-now .flex{ display:flex; gap:26px; align-items:center; }
  .hero-art{ width:clamp(150px,18vw,250px); height:clamp(150px,18vw,250px); border-radius:18px; flex-shrink:0;
    display:grid; place-items:center; font-size:64px; background:var(--surface2); box-shadow:0 0 70px -16px var(--accentGlow); }
  .hero-art.has-image{ background-size:cover; background-position:center; }
  .hero-title{ font-family:var(--body); font-weight:700; font-size:clamp(26px,3.1vw,46px); line-height:1.08;
    letter-spacing:-.5px; margin-bottom:5px; overflow-wrap:anywhere; text-shadow:0 0 40px #FFFFFF2E;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .hero-artist{ color:var(--dim); font-size:clamp(15px,1.5vw,20px); margin-bottom:10px; }
  .hero-by{ color:var(--gold); font-family:var(--display); font-size:clamp(14px,1.3vw,18px); font-weight:600; }
  .hero-hearts{ font-family:var(--display); font-size:clamp(15px,1.4vw,19px); color:var(--rose); margin-left:10px; white-space:nowrap; }
  .idle-hero{ text-align:center; padding:50px 10px 40px; }
  .idle-hero .big{ font-family:var(--script); color:var(--gold); font-size:clamp(34px,5vw,56px); margin-bottom:6px; }
  .idle-hero .sub{ color:var(--dim); font-size:15px; }

  /* ---- Richtungsband ----
     Die laufende Musikrichtung stand auf dieser Seite dreifach: gross in der
     "Laeuft gerade"-Karte, nochmal im Wechsel-Hinweis darunter und ein drittes Mal
     als fetter Name ueber den Balken. Jetzt steht der volle Name genau einmal -
     hier, quer ueber beide Spalten. Der Countdown haengt rechts daran, die Balken
     rechts tragen nur noch Kurznamen. */
  .dirband{ display:flex; align-items:center; gap:20px; margin-bottom:18px;
    padding:13px 22px 14px; border:1px solid var(--border); border-left:5px solid var(--accent);
    border-radius:18px; background:linear-gradient(90deg, var(--accentGlow) 0%, #FFFFFF0A 45%, #FFFFFF06 100%);
    box-shadow:0 0 70px -34px var(--accent); }
  .db-lbl{ display:flex; align-items:center; gap:9px; font-family:var(--display);
    text-transform:uppercase; letter-spacing:2.6px; font-size:11px; font-weight:600;
    color:var(--dim); margin-bottom:3px; }
  .db-chase{ text-transform:none; letter-spacing:.2px; font-size:12.5px; }
  .db-name{ font-family:var(--display); font-weight:600; line-height:1.05; min-width:0;
    font-size:clamp(26px,3.2vw,44px); display:flex; align-items:center; gap:13px; }
  .db-name .n{ text-shadow:0 0 34px currentColor; overflow-wrap:anywhere; }
  .db-name .eq{ height:26px; gap:4px; flex-shrink:0; }
  .db-name .eq i{ width:5px; }
  .db-name.tbd{ font-size:clamp(19px,1.9vw,25px); color:var(--dim); }
  .db-right{ margin-left:auto; flex-shrink:0; text-align:right;
    padding-left:20px; border-left:1px solid var(--border); }
  .db-eta{ font-family:var(--display); font-weight:600; line-height:1.1; color:var(--ink);
    font-size:clamp(21px,2.4vw,32px); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .db-sub{ font-size:12.5px; color:var(--dim); margin-top:3px; white-space:nowrap; }
  .dirband.hot{ animation:bandPulse 2.4s ease-in-out infinite; }
  @keyframes bandPulse{
    0%,100%{ box-shadow:0 0 70px -34px var(--accent); }
    50%{ box-shadow:0 0 96px -20px var(--accent); } }
  @media (max-width:980px){
    .dirband{ flex-wrap:wrap; }
    .db-right{ margin-left:0; padding-left:0; border-left:none; text-align:left; }
  }

  /* ---- Right column ---- */
  .panel{ background:#FFFFFF08; border:1px solid var(--border); border-radius:18px; padding:18px 18px 16px; box-shadow:none; margin-bottom:18px; }
  .panel .head{ margin-bottom:12px; align-items:baseline; }
  .panel .section-head{ font-size:19px; margin:0; letter-spacing:.4px; }
  /* Feine Goldlinie hinter jeder Ueberschrift - bindet die Kaesten optisch zusammen. */
  .panel .head::after{ content:""; flex:1; height:1px; margin-left:14px;
    background:linear-gradient(90deg, var(--border), transparent); }

  .up-row{ display:flex; align-items:center; gap:12px; padding:9px 2px; border-bottom:1px solid var(--border); }
  .up-row:last-child{ border-bottom:none; }
  .up-rank{ font-family:var(--display); font-size:19px; color:var(--accent); opacity:.6; width:20px; text-align:center; flex-shrink:0; }
  .up-mood{ width:30px; text-align:center; flex-shrink:0; font-size:16px; }
  .up-title{ font-weight:600; font-size:14.5px; }
  .up-artist{ color:var(--dim); font-size:12px; }
  .up-by{ color:var(--gold); font-size:11.5px; font-weight:600; }
  .up-hearts{ font-size:12.5px; color:var(--rose); flex-shrink:0; white-space:nowrap; }

  .chip-row{ display:flex; align-items:center; gap:10px; background:#FFFFFF0A; border:1px solid var(--border); border-radius:12px; padding:11px 14px; font-size:14px; }
  .chip-row b{ color:var(--gold); }

  .vote-box{ text-align:center; }
  .vote-label{ font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:1.5px; font-weight:600; margin-bottom:10px; }
  .vote-bars{ text-align:left; }
  .vote-bar-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
  .vote-bar-name{ width:auto; max-width:34%; flex-shrink:0; font-family:var(--display); font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vote-bar-row .bar-track{ flex:1; height:14px; }
  .vote-bar-count{ width:20px; flex-shrink:0; text-align:right; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .vote-timer{ color:var(--dim); font-size:12.5px; margin-top:4px; }
  .vote-winner{ font-family:var(--script); color:var(--gold); font-size:clamp(30px,4vw,40px); margin:6px 0 2px; }

  /* Richtungswahl der Gaeste: nur Balken, Kurznamen. Der volle Name steht im Band oben.
     Die fuehrende Zeile wird hell hervorgehoben statt nochmal ausgeschrieben. */
  .vrow{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .vrow:last-child{ margin-bottom:0; }
  .v-emoji{ width:22px; text-align:center; font-size:15px; flex-shrink:0; opacity:.7; }
  .v-name{ width:96px; flex-shrink:0; font-size:13px; color:var(--dim); }
  .vrow .bar-track{ flex:1; height:8px; }
  .v-pct{ width:34px; flex-shrink:0; text-align:right; font-size:12px; color:var(--dim);
    font-variant-numeric:tabular-nums; }
  .vrow.lead .v-emoji{ opacity:1; }
  .vrow.lead .v-name, .vrow.lead .v-pct{ color:var(--ink); font-weight:600; }
  .vibe-empty{ color:var(--dim); font-size:13px; line-height:1.45; }

  /* Albumcover als Raumhintergrund: zwei Ebenen, die beim Songwechsel ueberblenden. */
  .bgart{ position:fixed; inset:-10%; z-index:-1; background-size:cover; background-position:center;
    filter:blur(80px) saturate(1.6) brightness(.6); opacity:0; transition:opacity 1s ease; pointer-events:none; }
  .bgart.on{ opacity:.40; }

  /* Moment-Band: nur bei Voting-Sieg oder Meilenstein, nur am Songanfang. */
  .moment{ display:flex; align-items:center; gap:16px; margin-bottom:16px; padding:14px 22px;
    border:1px solid var(--accent); border-radius:16px; background:#FFFFFF12;
    box-shadow:0 0 60px -24px var(--accent); animation:momentIn .5s ease; }
  .moment .m-emoji{ font-size:34px; line-height:1; flex-shrink:0; }
  .moment .m-lbl{ font-family:var(--display); text-transform:uppercase; letter-spacing:2.5px;
    font-size:12px; font-weight:600; color:var(--dim); }
  .moment .m-main{ font-family:var(--display); font-weight:600; font-size:clamp(22px,2.2vw,32px);
    color:var(--ink); line-height:1.15; }
  @keyframes momentIn{ from{ opacity:0; transform:translateY(-10px); } to{ opacity:1; transform:none; } }

  /* ---- Statistik-Feld: eine Kachel, die alle paar Sekunden wechselt. ---- */
  .stat-panel{ margin-bottom:0; }
  .stat{ display:flex; align-items:center; gap:14px; min-height:56px;
    transition:opacity .35s ease, transform .35s ease; }
  .stat.out{ opacity:0; transform:translateY(6px); }
  .stat .s-emoji{ font-size:30px; line-height:1; flex-shrink:0; }
  .stat .s-val{ font-family:var(--display); font-weight:600; font-size:clamp(20px,2.1vw,30px);
    line-height:1.1; color:var(--gold); text-shadow:0 0 32px var(--accentGlow); }
  .stat .s-lbl{ color:var(--dim); font-size:12.5px; margin-top:3px; }
  .stat-dots{ display:flex; gap:5px; justify-content:center; margin-top:10px; }
  .stat-dots i{ width:5px; height:5px; border-radius:50%; background:#FFFFFF26; }
  .stat-dots i.on{ background:var(--gold); }

  /* Waehrend eines Votings wandert das Panel in die linke Spalte und wird gross. */
  #vote-slot-left .panel{ margin-top:18px; margin-bottom:0; }
  .vote-big .vote-label{ font-size:15px; margin-bottom:16px; }
  .vote-big .vote-bar-row{ margin-bottom:14px; }
  .vote-big .vote-bar-name{ font-size:24px; max-width:38%; }
  .vote-big .bar-track{ height:22px; }
  .vote-big .vote-bar-count{ width:30px; font-size:18px; }
  .vote-big .vote-timer{ font-size:16px; margin-top:10px; }
  .vote-big .vote-winner{ font-size:clamp(44px,5.5vw,68px); }
</style>
</head>
<body>
  <div id="bgart-a" class="bgart"></div>
  <div id="bgart-b" class="bgart"></div>
  <div class="stage">
    <div class="topbar">
      <div class="crest">
        <div class="monogram">C&nbsp;+&nbsp;D</div>
        <div class="couple">Caroline &amp; Daniel</div>
        <div class="toolname">Musik mit <b>DJ BazooKI</b></div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div id="clock" class="clock"></div>
        <div class="qrcard">
          <div class="qrbox" id="qrbox"></div>
          <div class="txt">Lied wünschen<b>Jetzt scannen</b></div>
        </div>
      </div>
    </div>

    <div id="dirband"></div>

    <div class="grid2">
      <div>
        <div id="moment"></div>
        <div id="now-hero" class="hero-now"></div>
        <div id="vote-slot-left"></div>

        <div class="panel" style="margin-top:18px;margin-bottom:0">
          <div class="head"><div class="section-head">Richtungswahl der Gäste</div></div>
          <div id="vibe"></div>
        </div>
      </div>

      <div>

        <div class="panel">
          <div class="head"><div class="section-head">Als Nächstes</div></div>
          <div id="upnext"></div>
        </div>

        <div id="vote-slot-right">
          <div id="vote-panel" class="panel vote-box" style="display:none"></div>
        </div>

        <!-- Bleibt versteckt, solange keine Kachel genug Daten hat (Abendanfang). -->
        <div class="panel stat-panel" id="stat-panel" style="display:none">
          <div id="stat" class="stat"></div>
          <div id="stat-dots" class="stat-dots"></div>
        </div>
      </div>
    </div>
  </div>

<script type="module">
import { MOODS, api, el, fmtClock, queueSort } from "/shared.js";

// Richtungsfarben in Neon - nur fuer diese Seite, guest.html und dj.html bleiben unberuehrt.
const NEON_COLORS = {
  "Party-Charts":             "#FFD24A",
  "Latino":                   "#FF7A3D",
  "RnB, Hip-Hop & Reggaeton": "#B36CFF",
  "Punk, Rock & UK Grunge":   "#FF4D6D",
  "Mundart & Schlager":       "#4ADE80",
};
for (const [name, color] of Object.entries(NEON_COLORS)) if (MOODS[name]) MOODS[name].color = color;

// Kurznamen fuer die Balken und den "holt auf"-Hinweis. Der volle Name steht auf
// dieser Seite nur im Richtungsband, sonst laese man ihn drei-, viermal gleichzeitig.
const SHORT = {
  "Party-Charts":             "Party",
  "Latino":                   "Latino",
  "RnB, Hip-Hop & Reggaeton": "RnB & Hip-Hop",
  "Punk, Rock & UK Grunge":   "Rock & Punk",
  "Mundart & Schlager":       "Mundart",
};
const MOOD_ORDER = Object.keys(NEON_COLORS);
const shortName = (m) => SHORT[m] || m;

// Faerbt den Hintergrundschleier in der Farbe der laufenden Richtung. Ohne
// committete Richtung bleibt es beim Gold der Party-Charts.
function applyAmbient(mood) {
  const c = (mood && MOODS[mood]?.color) || "#FFD24A";
  const root = document.documentElement.style;
  root.setProperty("--accent", c);
  root.setProperty("--accentGlow", c + "38");
}

const GUEST_URL = location.origin + "/guest.html";

function drawQr() {
  try {
    const qr = qrcode(0, "M");
    qr.addData(GUEST_URL);
    qr.make();
    const n = qr.getModuleCount();
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
    document.getElementById("qrbox").innerHTML =
      `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" width="100%" height="100%" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">` +
      `<rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#ffffff"/><path d="${d}" fill="#2E2820"/></svg>`;
  } catch (e) { /* Adresse ungueltig - QR bleibt leer, kein Fehler fuers Publikum sichtbar */ }
}

function tickClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" });
}

// Das laufende Albumcover liegt unscharf hinter allem. Zwei Ebenen, damit der
// Songwechsel ueberblendet statt springt.
let bgSlot = 0, bgUrl = null;
function setBgArt(url) {
  if (url === bgUrl) return;
  bgUrl = url || null;
  const a = document.getElementById("bgart-a"), b = document.getElementById("bgart-b");
  if (!bgUrl) { a.classList.remove("on"); b.classList.remove("on"); return; }
  const next = bgSlot ? b : a, cur = bgSlot ? a : b;
  next.style.backgroundImage = `url('${bgUrl}')`;
  next.classList.add("on");
  cur.classList.remove("on");
  bgSlot = 1 - bgSlot;
}

// Band ueber dem Hero - nur fuer Voting-Gewinner und Meilenstein-Wuensche, und nur
// in den ersten 30 Sekunden des Songs. Sonst steht es den ganzen Song lang da.
let momentKey = null;
function renderMoment(np, playback, requests) {
  const host = document.getElementById("moment");
  const r = np ? requests.find((x) => x.id === np.id) : null;
  const fresh = playback && playback.duration > 0 && playback.progress < 30000;
  let key = null, emoji = null, lbl = null, main = null;
  if (r && fresh && r.voteWin) {
    key = r.id + ":vote"; emoji = "🏆"; lbl = "Voting gewonnen";
    main = r.addedBy ? `${r.addedBy}s Lieblingslied` : "Das Lieblingslied des Gewinners";
  } else if (r && fresh && r.milestone) {
    key = r.id + ":milestone"; emoji = "🎉"; lbl = "Meilenstein";
    main = `Der ${r.milestone}. Wunsch des Abends` + (r.addedBy ? ` — von ${r.addedBy}` : "");
  }
  if (key === momentKey) return;
  momentKey = key;
  host.innerHTML = "";
  if (!key) return;
  host.append(el("div", { class: "moment" },
    el("div", { class: "m-emoji" }, emoji),
    el("div", { style: "min-width:0" },
      el("div", { class: "m-lbl" }, lbl),
      el("div", { class: "m-main truncate" }, main))));
}

function renderHero(np, playback, requests) {
  const host = document.getElementById("now-hero");
  if (!np) {
    setBgArt(null);
    host.innerHTML = "";
    host.append(el("div", { class: "idle-hero" },
      el("div", { class: "big" }, "Bald geht's los ✨"),
      el("div", { class: "sub" }, "Wünsche gleich hier scannen und mitgestalten.")));
    return;
  }
  setBgArt(np.image || null);
  const req = requests.find((r) => r.id === np.id);
  const hearts = req ? (req.weight ?? (1 + (req.voterIds?.length || 0))) : null;
  const by = req?.addedBy;
  const isAuto = by === "DJ BazooKI";
  const art = np.image
    ? el("div", { class: "hero-art has-image", style: `background-image:url('${np.image}')` })
    : el("div", { class: "hero-art" }, np.mood ? MOODS[np.mood]?.emoji || "🎵" : "🎵");

  host.innerHTML = "";
  const info = el("div", { style: "min-width:0;flex:1" },
    el("div", { class: "hero-title" }, np.title),
    el("div", { class: "hero-artist truncate" }, np.artist),
    el("div", { style: "display:flex;align-items:center;flex-wrap:wrap" },
      by ? el("span", { class: "hero-by" }, isAuto ? "🎧 DJ BazooKI Auswahl" : `♥ gewünscht von ${by}`) : null,
      hearts ? el("span", { class: "hero-hearts" }, "♥ " + hearts) : null));
  host.append(el("div", { class: "flex" }, art, info));

}

// curMood = die Richtung, die gerade laeuft. Wuensche aus einer anderen Richtung
// warten auf ihre Richtung und werden hier NICHT gezeigt (gleiche Logik wie die
// "wartet"-Liste in guest.html und das "wartet"-Badge in dj.html).
function renderUpNext(requests, nowId, curMood) {
  const host = document.getElementById("upnext");
  host.innerHTML = "";
  const onDirection = (r) => r.dj || r.auto || !curMood || r.mood === curMood;
  const queue = requests.filter((r) => r.status === "queued" && r.id !== nowId && !r.pool && !r.midnight && onDirection(r)).sort(queueSort).slice(0, 5);
  if (!queue.length) { host.append(el("div", { class: "empty" }, "Noch nichts in der Warteschlange.")); return; }
  queue.forEach((r, i) => {
    const m = MOODS[r.mood];
    const hearts = r.weight ?? (1 + (r.voterIds?.length || 0));
    host.append(el("div", { class: "up-row" },
      el("div", { class: "up-rank" }, i + 1),
      el("div", { class: "up-mood" }, r.milestone ? "🎉" : (m?.emoji || "🎵")),
      el("div", { style: "min-width:0;flex:1" },
        el("div", { class: "up-title truncate" }, r.title),
        el("div", { class: "up-artist truncate" }, r.artist),
        r.milestone ? el("div", { class: "up-by truncate" }, `${r.milestone}. Wunsch des Abends 🎉 — von ${r.addedBy}`)
          : (r.addedBy && r.addedBy !== "DJ BazooKI" && r.addedBy !== "DJ") ? el("div", { class: "up-by truncate" }, "von " + r.addedBy) : null),
      el("div", { class: "up-hearts" }, "♥ " + hearts)));
  });
}

// Waehrend eines laufenden Votings holt NUR diese Seite (nicht guest.html/dj.html)
// den Zwischenstand via /api/vote/live und zeigt ihn live als Balken.
// Waehrend abgestimmt wird, ist das Voting das Wichtigste im Raum: das Panel wandert
// aus der rechten Spalte nach links unter den Hero und wird gross.
function placeVote(active) {
  const panel = document.getElementById("vote-panel");
  const slot = document.getElementById(active ? "vote-slot-left" : "vote-slot-right");
  if (panel.parentElement !== slot) slot.append(panel);
  panel.classList.toggle("vote-big", !!active);
}

async function renderVote(data) {
  const host = document.getElementById("vote-panel");
  const v = data.vote;
  placeVote(!!v);
  if (!v) { host.style.display = "none"; return; }
  host.style.display = "";
  host.innerHTML = "";
  if (v.closed) {
    host.append(
      el("div", { class: "vote-label" }, "Voting"),
      el("div", { class: "vote-winner" }, v.winnerName ? v.winnerName : "—"),
      el("div", { class: "vote-timer" }, v.winnerName ? "hat gewonnen 🎉" : "niemand hat abgestimmt"));
    return;
  }
  const { data: live } = await api("/api/vote/live");
  const counts = live?.counts || v.names.map(() => 0);
  const total = counts.reduce((a, b) => a + b, 0);
  const max = Math.max(1, ...counts);
  const closesTxt = v.closesAt != null ? "schliesst in " + fmtClock(v.closesAt - Date.now()) : "schliesst nach diesem Song";
  host.append(
    el("div", { class: "vote-label" }, "Voting läuft 📲"),
    el("div", { class: "vote-bars" }, v.names.map((n, i) =>
      el("div", { class: "vote-bar-row" },
        el("div", { class: "vote-bar-name truncate" }, n),
        el("div", { class: "bar-track" }, el("div", { class: "bar-fill", style: `width:${Math.max(3, (counts[i] / max) * 100)}%;background:var(--gold)` })),
        el("div", { class: "vote-bar-count" }, counts[i])))),
    el("div", { class: "vote-timer" }, closesTxt + (total ? ` · ${total} Stimme${total === 1 ? "" : "n"}` : " · noch keine Stimme")));
}

/* ---- Statistik-Feld ----
   Kacheln laufen reihum. `ready` entscheidet, ob eine Kachel ueberhaupt genug Daten
   hat: am Anfang des Abends ist das keine einzige, dann bleibt das Feld ausgeblendet
   statt "1 Song gespielt" an die Wand zu werfen. Die Zahlen kommen aus /api/stats;
   Horn und Mitternachtslied sind dort schon rausgefiltert. */
const STAT_TILES = [
  { key: "wishes", emoji: "💫",
    ready: (s) => s.wishes > 0,
    val:   (s) => String(s.wishes),
    lbl:   (s) => s.wishes === 1 ? "Liederwunsch heute Abend" : "Liederwünsche heute Abend" },
  { key: "king", emoji: "👑",
    ready: (s) => s.king && s.king.count >= 2,
    val:   (s) => s.king.name,
    lbl:   (s) => `Wunsch-König:in — ${s.king.count} Wünsche` },
  { key: "hearted", emoji: "❤️",
    ready: (s) => s.hearted && s.hearted.votes >= 1,
    val:   (s) => s.hearted.title,
    lbl:   (s) => `${s.hearted.artist} · ♥ ${s.hearted.hearts} — die meisten Herzen` },
  { key: "waiting", emoji: "⏳",
    ready: (s) => s.waiting >= 1,
    val:   (s) => String(s.waiting),
    lbl:   (s) => s.waiting === 1 ? "Wunsch wartet auf seine Richtung" : "Wünsche warten auf ihre Richtung" },
  { key: "artist", emoji: "🎤",
    ready: (s) => s.topArtist && s.topArtist.plays >= 2,
    val:   (s) => s.topArtist.artist,
    lbl:   (s) => `meistgespielt — ${s.topArtist.plays} Songs` },
  { key: "guests", emoji: "🙋",
    ready: (s) => s.guests >= 1,
    val:   (s) => String(s.guests),
    lbl:   (s) => s.guests === 1 ? "Gast hat schon gewünscht" : "Gäste haben schon gewünscht" },
];
const STAT_ROTATE_MS = 12000;
let statData = null, statIdx = 0, statShown = null;

async function loadStats() {
  const { ok, data } = await api("/api/stats");
  if (ok && data) statData = data;
  renderStat(false);
}

function renderStat(advance) {
  const panel = document.getElementById("stat-panel");
  const host = document.getElementById("stat");
  const dots = document.getElementById("stat-dots");
  const tiles = statData ? STAT_TILES.filter((t) => t.ready(statData)) : [];
  if (!tiles.length) { panel.style.display = "none"; statShown = null; return; }
  panel.style.display = "";
  if (advance) statIdx++;
  const i = statIdx % tiles.length;
  const t = tiles[i];
  const val = t.val(statData), lbl = t.lbl(statData);

  dots.innerHTML = "";
  tiles.forEach((_, k) => dots.append(el("i", { class: k === i ? "on" : "" })));

  // Gleicher Inhalt wie eben -> nicht neu zeichnen. Sonst flackerte die Kachel bei
  // jedem Daten-Refresh, auch wenn sich gar nichts geaendert hat.
  const sig = t.key + "|" + val + "|" + lbl;
  if (sig === statShown) return;
  statShown = sig;
  host.classList.add("out");
  setTimeout(() => {
    host.innerHTML = "";
    host.append(
      el("div", { class: "s-emoji" }, t.emoji),
      el("div", { style: "min-width:0;flex:1" },
        el("div", { class: "s-val truncate" }, val),
        el("div", { class: "s-lbl truncate" }, lbl)));
    host.classList.remove("out");
  }, 350);
}

/* ---- Richtungsband ----
   Fasst zusammen, was vorher zwei Kaesten waren: die laufende Richtung
   (committedDirection) und der Countdown auf den naechsten Entscheid
   (directionSwitch). Der volle Richtungsname faellt hier genau einmal.
   Bewusst NICHT erwaehnt: das Horn und das Mitternachtslied - beides bleibt
   auf dem Beamer eine Ueberraschung. */
function renderDirBand(cd, ds) {
  const host = document.getElementById("dirband");
  const mood = cd?.mood || null;
  const m = mood ? MOODS[mood] : null;
  host.innerHTML = "";
  host.className = "dirband" + (ds?.phase ? " hot" : "");

  const eq = el("div", { class: "eq" });
  if (m) for (let i = 0; i < 5; i++) eq.append(el("i", { style: `background:${m.color};animation-delay:${i * 130}ms` }));

  // Wer aufholt - nur als Kurzname, sonst stuenden zwei volle Richtungsnamen nebeneinander.
  const ch = ds?.challenger && MOODS[ds.challenger] ? MOODS[ds.challenger] : null;
  const chase = (ch && !ds.phase)
    ? el("span", { class: "db-chase" },
        el("span", { class: "muted" }, "· "),
        el("span", { style: `color:${ch.color}` }, `${ch.emoji} ${shortName(ds.challenger)}`),
        el("span", { class: "muted" }, " holt auf"))
    : null;

  const left = el("div", { style: "min-width:0" },
    el("div", { class: "db-lbl" }, "Es läuft gerade", chase),
    m ? el("div", { class: "db-name" },
          el("span", {}, m.emoji),
          el("span", { class: "n", style: `color:${m.color}` }, mood),
          eq)
      : el("div", { class: "db-name tbd" }, "Richtung wird noch bestimmt…"));

  // Rechte Seite: was als Nächstes passiert. Vier Zustaende.
  let eta, sub;
  if (ds?.phase) {
    eta = "Jetzt";
    sub = ch ? `letztes Lied — danach ${ch.emoji} ${shortName(ds.challenger)}` : "letztes Lied dieser Richtung";
  } else if (ds?.midnightHold) {
    eta = "gleich";
    sub = "kurze Pause im Takt";
  } else if (ds?.dwellRemainingMs > 0) {
    eta = fmtClock(ds.dwellRemainingMs);
    sub = "bis zum nächsten Entscheid";
  } else {
    eta = "gleich";
    sub = "der Entscheid steht an";
  }

  host.append(left,
    el("div", { class: "db-right" },
      el("div", { class: "db-eta" }, eta),
      el("div", { class: "db-sub" }, sub)));
}

// Alle fünf Richtungen, immer in derselben Reihenfolge - so springen die Zeilen nicht
// hin und her, wenn sich die Stimmen verschieben. Nur Kurznamen (siehe SHORT).
function renderVibeBars(vibe, dom) {
  const host = document.getElementById("vibe");
  host.innerHTML = "";
  const by = Object.fromEntries((vibe?.rows || []).map((r) => [r.mood, r]));
  if (!(vibe?.total > 0)) {
    host.append(el("div", { class: "vibe-empty" }, "Noch keine Stimmen — wählt am Handy eure Richtung."));
    return;
  }
  for (const mood of MOOD_ORDER) {
    const m = MOODS[mood], pct = by[mood]?.pct || 0;
    host.append(el("div", { class: "vrow" + (mood === dom ? " lead" : "") },
      el("div", { class: "v-emoji" }, m?.emoji || "🎵"),
      el("div", { class: "v-name truncate" }, shortName(mood)),
      el("div", { class: "bar-track" },
        el("div", { class: "bar-fill", style: `width:${Math.max(2, pct * 100)}%;background:${m?.color || "var(--border)"}` })),
      el("div", { class: "v-pct" }, Math.round(pct * 100) + "%")));
  }
}

async function refresh() {
  const { data } = await api("/api/state");
  renderHero(data.nowPlaying, data.playback, data.requests);
  renderMoment(data.nowPlaying, data.playback, data.requests);
  renderUpNext(data.requests, data.nowPlaying?.id, data.committedDirection?.mood || null);
  await renderVote(data);
  applyAmbient(data.committedDirection?.mood || null);
  renderDirBand(data.committedDirection, data.directionSwitch);
  renderVibeBars(data.vibe, data.vibe?.dominant || null);
}

drawQr();
tickClock();
setInterval(tickClock, 15000);
refresh();
setInterval(refresh, 3500);
loadStats();
setInterval(loadStats, 15000);
setInterval(() => renderStat(true), STAT_ROTATE_MS);
</script>
